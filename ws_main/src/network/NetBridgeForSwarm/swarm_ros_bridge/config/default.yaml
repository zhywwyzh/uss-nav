config:
  debug: false                    # for debug only
  odom_convert: true              # convert odom to posestamped using odom_convert_node
  monitor_node: true              # check recv rate
  warn_threshold: 3               # if recv rate smaller than max_freq-warn_threashold, then warn
  monitor_rate_hz: 500            # it must be greater than max_freq

services:
  # --------- Services ---------- #
  - srv_name: /add_two_ints
    srv_type: swarm_ros_bridge/AddTwoInts
    serverIp: drone0
    clientIp:
      - drone1
      - drone2
    srcPort: 2000
    prefix: true

# --------- L3 v3: 6-topic real link ---------- #
# 机载 VLA 桥(bridge_drone.launch)用的表,必须与站侧
#   Real-Flight/src/ros_bridge/swarm_ros_bridge/config/obj_nav_cfg.yaml 的 topics 段逐条一致
#   (同 topic/msg_type/端口/src-dst)。
topics:
# odom: drone -> station
- topic_name: /ekf_quat/ekf_odom
  msg_type: nav_msgs/Odometry
  srcIP:
    - drone1
  srcPort: 3002
  max_freq: 30
  dstIP:
    - groundStation0
  prefix: false
  same_prefix: false

# fov-limited cloud: drone -> station
- topic_name: /cloud_fov_limited
  msg_type: sensor_msgs/PointCloud2
  cloudCompress: false
  cloudDownsample: -1.0
  cloudType: normal
  srcIP:
    - drone1
  srcPort: 3006
  max_freq: 10
  dstIP:
    - groundStation0
  prefix: false
  same_prefix: false

# full omni cloud (FAST-LIO world frame, MID-360 360°): drone -> station
# 世界模型 metric depth 用;max_freq 5 + 0.10m 体素降采样控制带宽
- topic_name: /cloud_registered
  msg_type: sensor_msgs/PointCloud2
  cloudCompress: false
  cloudDownsample: 0.10
  cloudType: normal
  srcIP:
    - drone1
  srcPort: 3016
  max_freq: 5
  dstIP:
    - groundStation0
  prefix: false
  same_prefix: false

# scene graph markers: drone -> station
- topic_name: /scene_graph/vis
  msg_type: visualization_msgs/MarkerArray
  srcIP:
    - drone1
  srcPort: 3007
  max_freq: 10
  dstIP:
    - groundStation0
  prefix: false
  same_prefix: false

# instruction: station -> drone
- topic_name: /bridge/Instruct
  msg_type: quadrotor_msgs/Instruction
  srcIP:
    - groundStation0
  srcPort: 3008
  max_freq: -1
  dstIP:
    - drone1
  prefix: false
  same_prefix: false

# agent prompt: station -> drone
- topic_name: /agent_prompt
  msg_type: quadrotor_msgs/AgentPrompt
  srcIP:
    - groundStation0
  srcPort: 3009
  max_freq: -1
  dstIP:
    - drone1
  prefix: false
  same_prefix: false

# camera: drone -> station (imgResizeRate 在发送侧生效)
- topic_name: /camera/color/image_raw
  msg_type: sensor_msgs/Image
  imgResizeRate: 1.0
  srcIP:
    - drone1
  srcPort: 4012
  max_freq: 5
  dstIP:
    - groundStation0
  prefix: false
  same_prefix: false

# planner mode trigger: station -> drone(世界模型下发前的模式 burst)
- topic_name: /uav_planner/trigger
  msg_type: std_msgs/Int32
  srcIP:
    - groundStation0
  srcPort: 3019
  max_freq: -1
  dstIP:
    - drone1
  prefix: false
  same_prefix: false

# takeoff/land controller command: station -> drone(世界模型 LAND_ON_TARGET)
- topic_name: /px4ctrl/takeoff_land
  msg_type: quadrotor_msgs/TakeoffLand
  srcIP:
    - groundStation0
  srcPort: 3020
  max_freq: -1
  dstIP:
    - drone1
  prefix: false
  same_prefix: false
